<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f6fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b101b" media="(prefers-color-scheme: dark)">
  <meta name="description" content="aaANDkk 的个人项目与官网入口导航。点击选择进入 Qure 图标展示馆或更多即将上线的独立站点。">
  <title>aaANDkk · 站点入口</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%233b66f5'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M21 44L32 19L43 44M25.5 36H38.5' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="hub.css">
  <script src="hub.js" defer></script>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid-veil"></span>
  </div>

  <div class="shell">
    <header class="hub-top">
      <a class="hub-brand" href="./" aria-label="aaANDkk 首页">
        <span class="brand-badge" aria-hidden="true">A</span>
        <span class="brand-meta">
          <strong>aaANDkk</strong>
          <small data-i18n="brandSub">PROJECT PORTAL</small>
        </span>
      </a>

      <div class="hub-controls">
        <a class="ctrl-btn" href="https://github.com/aaANDkk" target="_blank" rel="noopener noreferrer" aria-label="GitHub 主页" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 19c-4 1-4-2-6-2m12 5v-4a3.5 3.5 0 0 0-1-3c3-.4 6-1.5 6-6a4.6 4.6 0 0 0-1-3c.1-1 .1-2-.4-3 0 0-1.2-.4-3.6 1a13 13 0 0 0-6 0C6.6 2.6 5.4 3 5.4 3 5 4 4.9 5 5 6a4.6 4.6 0 0 0-1 3c0 4.5 3 5.6 6 6a3.5 3.5 0 0 0-1 3v4"/>
          </svg>
          <span class="ctrl-label">GitHub</span>
        </a>

        <button id="theme-toggle" class="ctrl-btn icon-only" type="button" aria-label="切换深浅主题" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>

        <button id="lang-toggle" class="ctrl-btn lang-btn" type="button" aria-label="Switch to English" lang="en">EN</button>
      </div>
    </header>

    <main class="hub-main">
      <section class="hub-hero">
        <div class="live-pill">
          <span class="live-dot" aria-hidden="true"></span>
          <span>aaandkk.github.io</span>
          <span class="pill-sep" aria-hidden="true">/</span>
          <span data-i18n="pillTag">目录索引</span>
        </div>

        <h1 data-i18n="heroTitle">选择你要前往的<span>独立站点。</span></h1>
        <p class="hero-desc" data-i18n="heroDesc">每个项目都在独立的子路径下运行与维护。挑选一张卡片，即刻进入。</p>
      </section>

      <section aria-label="项目入口列表" class="bento-section">
        <div id="project-grid" class="bento-grid"></div>
      </section>
    </main>

    <footer class="hub-foot">
      <div class="foot-left">
        <span data-i18n="footText">基于独立子目录结构部署，方便按项目持续迭代。</span>
      </div>
      <div class="foot-routes" id="foot-routes"></div>
    </footer>
  </div>
</body>
</html>
